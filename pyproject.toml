[project]
name = "search-engine-indexing-toolkit"
version = "1.0.0"
description = "Sitemap parsing, URL hygiene and submission to IndexNow, Bing Webmaster and Google APIs, dry run by default."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shijin" }]
dependencies = ["httpx>=0.27,<1", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
google = ["google-auth>=2.30,<3", "requests>=2.31,<3"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-defusedxml"]

[project.scripts]
indexkit = "indexkit.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["indexkit*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["indexkit"]

[[tool.mypy.overrides]]
module = ["google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
